<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>성경 통독 · 180일</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#faf8f3;
  --card:#ffffff;
  --text:#1c1c1c;
  --muted:#6b6b6b;
  --line:#e8e4dc;
  --accent:#0f766e;
  --accent-hover:#0a5a55;
  --accent-soft:#e6f1ef;
  --gold:#b8860b;
  --good:#16a34a;
  --bad:#dc2626;
  --shadow:0 2px 10px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%; line-height:1.6;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.4}
input[type=date],input[type=text]{
  font-family:inherit;font-size:16px;padding:.7em .9em;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);
  width:100%;margin-top:.4em;
}
input:focus{outline:none;border-color:var(--accent)}

#app{max-width:680px;margin:0 auto;padding:0 16px 96px;padding-top:env(safe-area-inset-top,0)}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 12px;
}
header h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.5px}
.group-name{font-size:.82rem;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:6px}
.icon-btn{
  width:40px;height:40px;border-radius:10px;font-size:1.15rem;
  background:#fff;border:1px solid var(--line);
}
.icon-btn:hover{background:var(--accent-soft)}

/* Setup */
.setup{padding:40px 8px;max-width:420px;margin:0 auto}
.setup h1{font-size:1.7rem;margin:0 0 10px;text-align:center}
.lead{text-align:center;color:var(--muted);margin:0 0 28px}
.form-row{display:block;font-size:.9rem;color:var(--muted);margin-bottom:18px}
.optional{font-size:.8em;color:#999}
.primary{
  width:100%;padding:14px;background:var(--accent);color:#fff;
  border-radius:12px;font-size:1.02rem;font-weight:600;margin-top:8px;
}
.primary:hover{background:var(--accent-hover)}
.hint{font-size:.82rem;color:var(--muted);margin-top:14px;text-align:center}

/* Progress */
.progress-wrap{margin:6px 4px 18px}
.progress-bar{height:8px;background:#ebe6dc;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#14a89a);transition:width .3s}
.progress-text{font-size:.78rem;color:var(--muted);margin-top:6px;text-align:right}

/* Day nav */
.day-nav{
  display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px;
}
.day-nav button{padding:10px 8px;font-size:.92rem;color:var(--accent);font-weight:600;border-radius:8px}
.day-nav button:hover:not(:disabled){background:var(--accent-soft)}
.day-indicator{text-align:center;padding:0 6px}
.day-num{font-size:1.05rem;font-weight:700;letter-spacing:-.3px}
.today-tag{
  display:inline-block;font-size:.7rem;background:var(--accent);color:#fff;
  padding:2px 8px;border-radius:99px;margin-top:3px;letter-spacing:.3px;
}
.goto-today{font-size:.72rem !important;color:var(--muted) !important;padding:2px 4px !important;}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.status-card{text-align:center;padding:32px 20px}
.status-card h2{margin:0 0 12px}

/* Passage */
.passage-card{padding:18px 18px 22px}
.passage-label{font-size:1.18rem;margin:0 0 8px;letter-spacing:-.3px;line-height:1.4}
.passage-ref{font-size:.82rem;color:var(--gold);margin-bottom:14px}
.study-only{padding:16px;background:var(--accent-soft);border-radius:10px;text-align:center}
.study-only p{margin:6px 0}
.study-text{font-weight:600;color:var(--accent)}

.passage-body{margin-top:8px}
.passage-block{margin-bottom:20px}
.passage-block:last-child{margin-bottom:0}
.book-title{
  font-size:1.02rem;font-weight:700;color:var(--accent);margin:18px 0 6px;
  padding-bottom:6px;border-bottom:2px solid var(--accent-soft);
}
.passage-block:first-child .book-title{margin-top:6px}
.chapter{margin:10px 0 14px}
.ch-title{
  font-size:.88rem;font-weight:700;color:var(--muted);margin:14px 0 6px;
  letter-spacing:.5px;
}
.verse{margin:0 0 .25em;font-size:1.02rem;line-height:1.75;text-indent:0;padding-left:1.6em;position:relative}
.vnum{
  display:inline-block;font-size:.72rem;color:var(--muted);
  font-weight:600;min-width:1.4em;text-align:right;
  position:absolute;left:0;top:.35em;
}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.actions button{
  padding:12px 4px;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  font-size:.88rem;font-weight:600;
}
.actions button:hover{border-color:var(--accent);color:var(--accent)}
.check.checked{background:var(--good);color:#fff;border-color:var(--good)}
.check.checked:hover{background:var(--good);color:#fff}

/* List view */
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.list-summary{font-size:.85rem;color:var(--muted)}
.back-btn{font-size:.92rem;color:var(--accent);font-weight:600;padding:6px 0}
.day-list{list-style:none;padding:0;margin:0}
.list-item{
  display:grid;grid-template-columns:48px 1fr 28px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:6px;cursor:pointer;
  transition:background .15s;
}
.list-item:hover{background:var(--accent-soft)}
.list-item.read{background:#f3f8f6}
.list-item.read .li-label{color:var(--muted)}
.list-item.today{border-color:var(--accent);border-width:2px;padding:11px 13px}
.list-item.today .li-num{color:var(--accent);font-weight:700}
.list-item.study{font-style:italic}
.li-num{font-size:.88rem;color:var(--muted);font-weight:600}
.li-label{font-size:.95rem}
.li-check{color:var(--good);font-weight:700;text-align:right}

/* Settings */
.settings-card label{margin-bottom:14px}
.divider{height:1px;background:var(--line);margin:18px 0}
.danger,.danger-outline{
  width:100%;padding:12px;border-radius:10px;font-weight:600;
  font-size:.92rem;margin-top:8px;
}
.danger{background:var(--bad);color:#fff}
.danger:hover{background:#b91c1c}
.danger-outline{background:#fff;border:1.5px solid var(--bad);color:var(--bad)}
.danger-outline:hover{background:#fef2f2}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#1c1c1c;color:#fff;padding:12px 20px;border-radius:24px;
  font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mode select */
.mode-choice{display:grid;gap:12px;margin-top:24px}
.mode-card{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:18px 20px;text-align:left;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:14px;
}
.mode-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.mode-icon{font-size:1.8rem}
.mode-text{flex:1}
.mode-title{font-weight:700;font-size:1.02rem;margin-bottom:2px}
.mode-desc{font-size:.82rem;color:var(--muted);line-height:1.5}

/* Invite share */
.invite-box{
  background:var(--accent-soft);border-radius:12px;padding:18px;text-align:center;
  margin:16px 0;
}
.invite-code{
  font-size:1.6rem;font-weight:700;letter-spacing:.3em;
  color:var(--accent);margin:8px 0 4px;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.invite-link{
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:.78rem;color:var(--muted);word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:10px;
}
.invite-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.invite-actions button{
  padding:11px;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:600;font-size:.9rem;
}
.invite-actions button:hover{background:var(--accent-hover)}

/* Members preview & list */
.members-preview{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:14px;
}
.members-preview-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
}
.members-preview-head .label{font-size:.82rem;color:var(--muted);font-weight:600}
.members-preview-head .more{font-size:.8rem;color:var(--accent);font-weight:600;cursor:pointer}
.member-row{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
  padding:6px 0;font-size:.92rem;
}
.member-row.me{font-weight:600}
.member-name{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.member-progress b{color:var(--text)}
.you-tag{font-size:.65rem;background:var(--accent);color:#fff;padding:1px 6px;border-radius:99px}

/* Members full view */
.members-card .member-row{padding:10px 0;border-bottom:1px solid var(--line)}
.members-card .member-row:last-child{border-bottom:none}
.member-bar{
  height:4px;background:#ebe6dc;border-radius:99px;overflow:hidden;
  margin-top:4px;grid-column:1 / -1;
}
.member-bar-fill{height:100%;background:var(--accent)}
.members-card .member-row{grid-template-columns:1fr auto;row-gap:4px}

/* Sync indicator */
.sync-status{
  font-size:.72rem;color:var(--muted);text-align:center;margin-top:8px;
}
.sync-error{color:var(--bad)}

/* Wide screens */
@media (min-width:520px){
  .day-num{font-size:1.15rem}
  .passage-label{font-size:1.3rem}
}
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="groups.js"></script>
  <script src="schedule-data.js"></script>
  <script src="bible-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
